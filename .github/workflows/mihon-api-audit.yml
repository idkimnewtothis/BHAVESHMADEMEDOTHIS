name: Audit Mihon API
on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 1'
  pull_request:
    paths:
      - 'packages/anymex_extension_bridge/android/**'
      - 'docs/mihon-api-pin.json'
      - 'scripts/check_mihon_upstream.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_mihon_upstream.py
        env:
          GH_TOKEN: ${{ github.token }}
